<section class="section page-section">
  <div class="container form-wrapper">
    <div class="section-header">
      <span class="section-tag">Review</span>
      <h1 class="page-title">Share Your <span class="gradient-text">Experience</span></h1>
      <p class="section-sub">Your feedback helps us improve and helps others trust us</p>
    </div>

    <form id="reviewForm" class="order-form" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label for="revName">Your Name *</label>
          <input type="text" id="revName" required placeholder="e.g. Ahmed Khan" />
        </div>
        <div class="form-group">
          <label for="revCity">City *</label>
          <input type="text" id="revCity" required placeholder="e.g. Lahore" />
        </div>
      </div>

      <div class="form-group">
        <label for="revService">Which service did you use? *</label>
        <select id="revService" required>
          <option value="">-- Select a service --</option>
          <option value="Logo Design">Logo Design</option>
          <option value="Web Development">Web Development</option>
          <option value="Video Editing">Video Editing</option>
          <option value="SEO">SEO</option>
          <option value="Social Media">Social Media</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Your Rating *</label>
        <div class="rating-input" id="ratingInput" role="radiogroup" aria-label="Rating">
          <span data-value="1" role="radio" aria-label="1 star" tabindex="0">★</span>
          <span data-value="2" role="radio" aria-label="2 stars" tabindex="0">★</span>
          <span data-value="3" role="radio" aria-label="3 stars" tabindex="0">★</span>
          <span data-value="4" role="radio" aria-label="4 stars" tabindex="0">★</span>
          <span data-value="5" role="radio" aria-label="5 stars" tabindex="0">★</span>
        </div>
        <input type="hidden" id="revRating" value="5" />
      </div>

      <div class="form-group">
        <label for="revMessage">Your Review *</label>
        <textarea id="revMessage" rows="5" required placeholder="Tell us about your experience with Pixel Craft..."></textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg">
        Submit Review
      </button>
      <p class="form-note">Your review will be added to the website after submission.</p>
    </form>
  </div>
</section>
